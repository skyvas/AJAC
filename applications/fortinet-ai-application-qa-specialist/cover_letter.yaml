body_paragraphs:
  - >
    I am writing to express my strong interest in the AI Application QA Specialist role on the FortiOS Release QA team at Fortinet in Burnaby. With over 6 years of experience in software test automation, API testing, and AI-assisted quality engineering, I am excited by Fortinet's work in building high-performance, AI-powered cybersecurity infrastructure.
  - >
    Throughout my career, I have designed scalable test automation frameworks and streamlined verification pipelines. Most recently at Plato, I integrated Playwright automation with AI agent workflows, reducing test development effort and accelerating regression cycles. Previously at AMD Silo AI and Imperva, I led security-focused API testing, created automated regression suites for backend platforms, and validated security mechanisms such as MFA and SSO within containerized cloud environments.
  - >
    What particularly draws me to this role is the opportunity to validate AI-powered features directly supporting FortiOS verification. Fortinet's focus on rigor, comprehensive model evaluation, and automated defect detection in networking and cybersecurity matches the technical challenges I find most rewarding.
  - >
    My approach to quality engineering combines a strong analytical mindset, deep attention to edge cases, and hands-on scripting in Python, Shell, and TypeScript. I take pride in creating clear defect reports, collaborating closely with developers, and ensuring complex systems remain resilient under high load and simulated failure conditions.
  - >
    Thank you for your time and consideration. I would welcome the opportunity to discuss how my background in AI-assisted testing and cybersecurity automation can contribute to the FortiOS Release QA team.
