body_paragraphs:
  - >
    I am writing to express my strong interest in the Software Development Engineer in Test (SDET) II (Automation and Build Developer) position at LMI Technologies in Burnaby. With over 6 years of experience in test automation framework engineering, CI/CD build pipeline integration, and software verification, I am eager to contribute to LMI's world-leading 3D scanning and machine vision technologies.
  - >
    Throughout my career, I have designed scalable automation frameworks and optimized automated testing within CI/CD pipelines. At Plato and ESDC, I built automated test frameworks with Playwright, TypeScript, and Selenium, integrated automated test suites into GitHub Actions pipelines, and validated system stability across containerized Docker and Kubernetes environments. At Imperva and AMD Silo AI, I developed custom automation scripts in Python, Shell, and SQL, cutting manual verification effort by up to 80%.
  - >
    I am particularly drawn to LMI Technologies' engineering culture and its focus on high-precision 3D sensor and inspection software. Developing automated validation solutions directly inside the build pipeline and ensuring sensor software releases are robust and defect-free align closely with my technical background in test automation and systems resilience.
  - >
    My working style is centered on practical engineering, attention to edge cases, and collaborative teamwork. I have experience partnering closely with developers to ensure code changes are testable, writing actionable diagnostic defect logs in Jira and X-Ray, and optimizing test execution times.
  - >
    Thank you for your time and consideration. I would welcome the opportunity to discuss how my test automation and build engineering background can support the Software Operations team at LMI Technologies.
