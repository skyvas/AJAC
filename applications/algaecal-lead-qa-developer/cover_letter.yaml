body_paragraphs:
  - >
    I am excited to apply for the Lead QA Developer / Automation QA Engineer (Lead) position at AlgaeCal in Vancouver. With over 6 years of experience architecting test automation frameworks in Playwright, TypeScript, and Selenium, coupled with a passion for mentoring engineers, I would love to lead and scale quality engineering across AlgaeCal's eCommerce and storefront applications.
  - >
    Throughout my career, I have designed resilient UI and API automation frameworks that streamline regression cycles and integrate into CI/CD pipelines. At Plato, I led the architecture of a Playwright framework integrated with AI workflows to accelerate test creation. In previous roles at ESDC and Plato, I built TypeScript and Selenium test suites that cut manual testing efforts by 45%, managed code reviews on GitHub, and configured automated GitHub Actions pipelines with Allure reporting.
  - >
    I admire AlgaeCal's commitment to product excellence, health innovation, and building high-reliability digital experiences for customers. Leading test automation for a dynamic React-based storefront and core middleware aligns directly with my passion for creating fast, maintainable test architectures that eliminate flaky tests and enable confident deployments.
  - >
    My leadership style centers on clear technical communication, thorough test strategy planning, and collaborative mentorship. I enjoy working closely with developers and product teams during sprint planning to identify risks early, establish actionable QA metrics, and foster a culture of quality across the entire engineering lifecycle.
  - >
    Thank you for your time and consideration. I would welcome the opportunity to discuss how my automation architecture and team leadership experience can help drive quality at AlgaeCal.
