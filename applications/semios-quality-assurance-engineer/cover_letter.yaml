body_paragraphs:
  - >
    I am writing to apply for the Quality Assurance Engineer role at Semios.
    With over 6 years of experience across software quality assurance, UI and API
    test automation, and defect management, I am drawn to testing data-heavy,
    mission-critical platforms that agricultural growers rely on every day to
    manage crop health, water, and automated farm operations across millions of acres.
  - >
    Throughout my background, I have owned testing deliverables across the complete
    software lifecycle: designing comprehensive test plans and test cases, executing
    functional, exploratory, regression, and integration testing, and logging clear,
    actionable defect reports in Jira and X-Ray. I have collaborated closely with product,
    development, and operations teams to review acceptance criteria before release,
    maintain regression suites, and support biweekly deployments across cloud, web, and
    mobile environments.
  - >
    What stands out about Semios is the sheer scale and tangible real-world impact of your
    platform: managing over 200 million acres across five countries through integrated
    crop protection, water management, and tools like Agworld and Altrac. I thrive in
    environments where data accuracy, backend service reliability, and integration integrity
    directly impact field operations, and I would love the opportunity to contribute to the
    quality and stability of Semios's platform.
  - >
    As a detail-oriented QA engineer, I bring strong hands-on expertise in API testing with
    Postman, UI test automation with Selenium and Playwright, and backend validation across
    cloud microservices. Furthermore, I actively build AI-assisted test workflows and agentic
    tooling to accelerate test case generation and reduce repetitive manual regression cycles,
    which aligns closely with your team's goal of continuous testing and embracing modern tooling.
  - >
    Thank you for your time and consideration. I would welcome the opportunity to discuss how
    my test automation background, API testing expertise, and quality engineering mindset can
    support Semios's QA initiatives.
